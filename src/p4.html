<script>
(function(){
"use strict";
var D=window.BBX, S=D.sounds, P=D.patterns, I=window.BBX_I18N||{};
var FAMS=['pulmonic','glottalic','lingual','buccal','aerodynamic','external'];
var FAM_EN={pulmonic:'Pulmonic',glottalic:'Glottalic',lingual:'Lingual (click)',
  buccal:'Buccal',aerodynamic:'Aerodynamic',external:'External'};
var FAMDESC_EN={
  pulmonic:'Powered by the lungs — the mechanism behind almost all speech.',
  glottalic:'Powered by the larynx acting as a piston: ejectives and implosives.',
  lingual:'Powered by the tongue rarefying a sealed pocket: clicks.',
  buccal:'Powered by the cheeks and tongue alone. The lungs stay free.',
  aerodynamic:'A whistle: a narrow jet exciting a cavity, with no vibrating tissue.',
  external:'No airstream at all — the energy comes from outside the body.'};
var ROLES=['kick','snare','hat','cymbal','bass','melody','fx','bass+melody'];
var ROLE_EN={kick:'Kick',snare:'Snare',hat:'Hi-hat',cymbal:'Cymbal',bass:'Bass',
  melody:'Melodic',fx:'Effect','bass+melody':'Bass + melody'};
var AIR_EN={PE:'pulmonic egressive',PI:'pulmonic ingressive',GE:'glottalic egressive (ejective)',
  GI:'glottalic ingressive (implosive)',LI:'lingual ingressive (click)',LE:'lingual egressive',
  BE:'buccal egressive',BI:'buccal ingressive',AE:'aerodynamic (whistle)',
  AI:'aerodynamic ingressive'};
var $=function(s){return document.querySelector(s)};
var el=function(t,c,x){var e=document.createElement(t);if(c)e.className=c;
  if(x!=null)e.textContent=x;return e};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){
  return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]})};
var famColor=function(f){return 'var(--'+f+')'};
var fmtHz=function(v){return v>=1000?(v/1000).toFixed(v>=10000?0:1)+'k':Math.round(v)+''};
var SVGNS='http://www.w3.org/2000/svg';
function sv(t,a){var e=document.createElementNS(SVGNS,t);for(var k in a)e.setAttribute(k,a[k]);return e}

/* ---------------- i18n ---------------- */
var LANG='en';
try{var sl=localStorage.getItem('bbx-lang'); if(sl==='zh'||sl==='en')LANG=sl;}catch(e){}
function dict(g){return (I[LANG]&&I[LANG][g])||null}
function T(k,en){ if(LANG==='en')return en; var d=dict('ui'); var v=d&&d[k];
  return (v==null||v==='')?en:v }
function TV(g,k,en){ if(LANG==='en')return en; var d=dict(g); var v=d&&d[k];
  return (v==null||v==='')?en:v }
function TS(id,f,en){ if(LANG==='en')return en; var d=dict('sounds'); var s=d&&d[id];
  var v=s&&s[f]; return (v==null||v==='')?en:v }
function TD(g,en){ if(LANG==='en')return en; var d=dict(g); var v=d&&d[en];
  return (v==null||v==='')?en:v }
/* Technical terms compose the same way in both languages (modifier first), so a small
   atom dictionary covers hundreds of phrases consistently. A phrase override wins. */
function compose(group,en){
  if(LANG==='en')return en;
  var ph=dict(group+'Phrase'); if(ph&&ph[en])return ph[en];
  var d=dict(group+'Atom'); if(!d)return en;
  var parts=en.split(/(\s*\+\s*|\s*→\s*|\s*\/\s*)/), out='', any=false;
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    if(/^\s*\+\s*$/.test(p)){out+=' + ';continue}
    if(/^\s*→\s*$/.test(p)){out+=' → ';continue}
    if(/^\s*\/\s*$/.test(p)){out+='／';continue}
    p=p.trim(); if(!p)continue;
    var m=/^([^(]*?)\s*\(([^)]*)\)$/.exec(p);
    if(m){
      var head=m[1].trim();
      var h=head?(d[head.toLowerCase()]||head):'';
      if(head&&d[head.toLowerCase()])any=true;
      var ms=m[2].split(',').map(function(x){
        var k='('+x.trim().toLowerCase()+')', v=d[k]; if(v)any=true; return v||x.trim()});
      out+=h+'（'+ms.join('、')+'）';
    } else {
      var v2=d[p.toLowerCase()]; if(v2)any=true; out+=v2||p;
    }
  }
  return any?out:en;
}
var FAMLABEL=function(f){return TV('fam',f,FAM_EN[f])};
var FAMDESC=function(f){return TV('famDesc',f,FAMDESC_EN[f])};
var ROLELABEL=function(r){return TV('role',r,ROLE_EN[r]||r)};
var SNAME=function(s){return TS(s.id,'name',s.name)};
var PLACE=function(p){return TV('place',p,p[0].toUpperCase()+p.slice(1))};
var MANNER=function(m){return TV('manner',m,m[0].toUpperCase()+m.slice(1))};
var CAT=function(c){return TV('cat',c,c)};

function applyI18n(root){
  (root||document).querySelectorAll('[data-i18n]').forEach(function(n){
    if(n.dataset.en==null)n.dataset.en=n.textContent.replace(/\s+/g,' ').trim();
    n.textContent=T(n.dataset.i18n,n.dataset.en);
  });
  (root||document).querySelectorAll('[data-i18n-html]').forEach(function(n){
    if(n.dataset.enHtml==null)n.dataset.enHtml=n.innerHTML;
    var k=n.dataset.i18nHtml, d=dict('html'), v=(LANG!=='en'&&d)?d[k]:null;
    n.innerHTML=(v==null||v==='')?n.dataset.enHtml:v;
  });
  (root||document).querySelectorAll('[data-i18n-ph]').forEach(function(n){
    if(n.dataset.enPh==null)n.dataset.enPh=n.getAttribute('placeholder')||'';
    n.setAttribute('placeholder',T(n.dataset.i18nPh,n.dataset.enPh));
  });
  document.documentElement.lang = LANG==='zh'?'zh':'en';
  $('#lang-label').textContent = LANG==='zh'?'EN':'中文';
  $('#lang').setAttribute('aria-label', LANG==='zh'?'Switch to English':'切换到中文');
}

/* ---------------- theme ---------------- */
try{var st=localStorage.getItem('bbx-theme'); if(st)document.documentElement.dataset.theme=st;}catch(e){}
$('#theme').addEventListener('click',function(){
  var cur=document.documentElement.dataset.theme;
  if(!cur)cur=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var nxt=cur==='dark'?'light':'dark';
  document.documentElement.dataset.theme=nxt;
  try{localStorage.setItem('bbx-theme',nxt)}catch(e){}
});

/* ---------------- tooltip ---------------- */
var tip=$('#tip');
function showTip(x,y,html){tip.innerHTML=html;tip.classList.add('on');
  var r=tip.getBoundingClientRect();
  var lx=Math.min(Math.max(8,x+13),innerWidth-r.width-8);
  var ly=y-r.height-12; if(ly<8)ly=y+18;
  tip.style.left=lx+'px';tip.style.top=ly+'px';}
function hideTip(){tip.classList.remove('on')}

/* ---------------- audio ----------------
   Mobile Safari imposes three rules this engine has to respect:
   1. An AudioContext only starts if it emits something DURING a user gesture, so the first
      tap synchronously plays a one-sample silent buffer before any async work begins.
   2. HTMLAudioElement.play() must also be called inside the gesture — never from a load
      callback — or it rejects with NotAllowedError.
   3. Decoded buffers are float32 at the hardware rate (48 kHz on iPhone), so sprite files are
      capped at 45 s (~8 MB decoded) and only a few stay resident. */
var AudioEngine=(function(){
  var ctx=null,bufs={},order=[],pending={},active=[],useFallback=false,rafId=null;
  var MAX_BUFS=4, unlocked=false, lastError=null;
  function getCtx(){
    if(!ctx){
      var C=window.AudioContext||window.webkitAudioContext;
      if(!C){useFallback=true;return null}
      try{ctx=new C()}catch(e){useFallback=true;lastError=e;return null}
    }
    if(ctx.state==='suspended'){ try{ctx.resume()}catch(e){} }
    return ctx;
  }
  /* Must run synchronously inside a real user gesture. */
  function unlock(){
    var c=getCtx(); if(!c)return false;
    if(!unlocked){
      try{
        var b=c.createBuffer(1,1,c.sampleRate);
        var s=c.createBufferSource(); s.buffer=b;
        s.connect(c.destination); s.start(0);
        unlocked=true;
      }catch(e){ lastError=e }
    }
    if(c.state==='suspended'){ try{c.resume()}catch(e){} }
    return c.state!=='suspended';
  }
  ['pointerdown','touchend','keydown'].forEach(function(ev){
    document.addEventListener(ev,function(){unlock()},{capture:true,once:false,passive:true});
  });
  function keep(file){
    var i=order.indexOf(file); if(i>=0)order.splice(i,1);
    order.push(file);
    while(order.length>MAX_BUFS){ delete bufs[order.shift()] }
  }
  function load(file){
    if(bufs[file]){keep(file);return Promise.resolve(bufs[file])}
    if(pending[file])return pending[file];
    var c=getCtx(); if(!c)return Promise.reject(new Error('no-webaudio'));
    pending[file]=fetch(file).then(function(r){
        if(!r.ok)throw new Error('HTTP '+r.status+' on '+file); return r.arrayBuffer()})
      .then(function(ab){return new Promise(function(res,rej){
        var pr=c.decodeAudioData(ab,res,rej); if(pr&&pr.then)pr.then(res,rej)})})
      .then(function(b){bufs[file]=b;keep(file);delete pending[file];return b})
      .catch(function(e){delete pending[file];lastError=e;throw e});
    return pending[file];
  }
  /* The element path asks the browser to play the slice itself via a media-fragment URI
     (#t=start,end), which Safari honours. Setting currentTime by hand is the backstop,
     because on iOS it throws until the media is seekable and the clip then plays from 0. */
  var fbCur=null;
  function playFallback(file,start,dur,onEnd,onFail){
    if(fbCur){try{fbCur.el.pause()}catch(e){} fbCur=null}
    var end=start+dur;
    var a=new Audio(file+'#t='+start.toFixed(3)+','+end.toFixed(3));
    a.preload='auto'; a.playsInline=true;
    a.setAttribute('playsinline',''); a.setAttribute('webkit-playsinline','');
    var stopped=false, seeked=(start<=0.01), started=null, fragOK=null, tries=0;
    function trySeek(){
      if(stopped||seeked||a.readyState<1||tries>=10)return;
      tries++;
      try{ a.currentTime=start; seeked=Math.abs(a.currentTime-start)<0.4 }
      catch(e){ seeked=false }
    }
    ['loadedmetadata','loadeddata','canplay','playing','progress'].forEach(function(ev){
      a.addEventListener(ev,function(){
        /* did the fragment take effect on its own? */
        if(fragOK===null && a.readyState>=1 && a.currentTime>0.01) fragOK=true;
        if(fragOK!==true) trySeek();
      });
    });
    function finish(){
      if(stopped)return; stopped=true;
      try{a.pause()}catch(e){}
      if(rafId){cancelAnimationFrame(rafId);rafId=null}
      if(fbCur&&fbCur.el===a)fbCur=null;
      if(onEnd)onEnd();
    }
    a.addEventListener('ended',finish);
    function watch(){
      if(stopped)return;
      if(a.paused && started!==null){ finish(); return }
      if(!seeked && fragOK!==true && tries<10) trySeek();
      if(started===null && (a.currentTime>0||tries>=10)) started=performance.now();
      /* If neither the fragment nor a manual seek took hold we cannot trust currentTime,
         so fall back to stopping on wall-clock time from when playback began. */
      var trust = (fragOK===true)||seeked;
      var bySlice = trust && a.currentTime>=end-0.03;
      var byClock = started!==null && (performance.now()-started) > (dur+(trust?1.5:0.35))*1000;
      if(bySlice||byClock){ finish(); return }
      rafId=requestAnimationFrame(watch);
    }
    var pr=a.play();
    if(pr&&pr.catch)pr.catch(function(e){ lastError=e; stopped=true; if(onFail)onFail(e) });
    rafId=requestAnimationFrame(watch);
    fbCur={el:a};
    return function(){ if(!stopped){stopped=true; try{a.pause()}catch(e){}
      if(rafId){cancelAnimationFrame(rafId);rafId=null} if(fbCur&&fbCur.el===a)fbCur=null } };
  }
  function stopAll(){
    active.forEach(function(s){try{s.stop()}catch(e){}}); active=[];
    if(fbCur){try{fbCur.el.pause()}catch(e){} fbCur=null}
    if(rafId){cancelAnimationFrame(rafId);rafId=null}
  }
  return {
    unlock:unlock,
    ready:function(){return !useFallback && !!ctx && ctx.state==='running'},
    error:function(){return lastError},
    preload:function(f){return load(f).catch(function(){})},
    play:function(file,start,dur,onEnd,onFail){
      stopAll();
      var running=unlock();            /* synchronous, inside the gesture */
      var stopped=false, stopFb=null;
      if(useFallback||!running){
        stopFb=playFallback(file,start,dur,onEnd,onFail);
        return function(){if(stopFb)stopFb()};
      }
      var c=getCtx();
      load(file).then(function(b){
        if(stopped)return;
        var s=c.createBufferSource(); s.buffer=b;
        var g=c.createGain(); g.gain.value=1;
        s.connect(g); g.connect(c.destination);
        s.onended=function(){if(onEnd)onEnd()};
        s.start(0,start,dur); active.push(s);
        g.gain.setValueAtTime(1,c.currentTime+Math.max(0,dur-0.03));
        g.gain.linearRampToValueAtTime(0,c.currentTime+dur);
      }).catch(function(e){
        if(stopped)return;
        useFallback=true;           /* decode or fetch failed — try the element path */
        stopFb=playFallback(file,start,dur,onEnd,onFail);
      });
      return function(){stopped=true;if(stopFb)stopFb();stopAll()};
    },
    trigger:function(file,start,dur,when,gain){
      var c=getCtx(); if(!c||useFallback)return;
      var b=bufs[file]; if(!b)return;
      keep(file);
      var s=c.createBufferSource(); s.buffer=b;
      var g=c.createGain(); g.gain.value=gain==null?1:gain;
      s.connect(g); g.connect(c.destination);
      var d=Math.min(dur,0.55);
      s.start(when,start,d);
      g.gain.setValueAtTime(g.gain.value,when+Math.max(0,d-0.05));
      g.gain.linearRampToValueAtTime(0,when+d);
    },
    loaded:function(file){return !!bufs[file]},
    ctx:getCtx, stopAll:stopAll
  };
})();

var np=$('#np'),npName=$('#np-name'),npMeta=$('#np-meta');
var curBtn=null,curStop=null,npTimer=null;
function clearPlay(){ if(curBtn)curBtn.classList.remove('on'); curBtn=null;
  np.classList.remove('on'); np.classList.remove('err');
  if(curStop){curStop();curStop=null} }
function playFailed(){
  clearPlay();
  npName.textContent=T('audio.blocked','Audio was blocked by the browser');
  npMeta.textContent=T('audio.blockedhint','tap again · check the silent switch');
  np.classList.add('on'); np.classList.add('err');
  if(npTimer)clearTimeout(npTimer);
  npTimer=setTimeout(function(){np.classList.remove('on');np.classList.remove('err')},6000);
}
function playSound(s,btn){
  if(curBtn===btn){AudioEngine.stopAll();clearPlay();return}
  clearPlay();
  var g=D.sprites.sounds[s.grp]; if(!g||!s.off)return;
  btn.classList.add('on'); curBtn=btn;
  npName.textContent=SNAME(s);
  npMeta.textContent=(s.ac.dur?s.ac.dur.toFixed(2)+'s':'')+
    (s.ac.f0?'  ·  '+Math.round(s.ac.f0)+' Hz':'');
  np.classList.add('on');
  curStop=AudioEngine.play(g.file,s.off[0],s.off[1],function(){clearPlay()},playFailed);
}
function playPattern(p,btn){
  if(curBtn===btn){AudioEngine.stopAll();clearPlay();return}
  clearPlay();
  var g=D.sprites.patterns[p.grp]; if(!g||!p.off)return;
  btn.classList.add('on'); curBtn=btn;
  npName.textContent=TV('patterns',p.id,p.name)+'  ·  '+TV('level',p.level,p.level);
  npMeta.textContent=p.off[1].toFixed(1)+'s';
  np.classList.add('on');
  curStop=AudioEngine.play(g.file,p.off[0],p.off[1],function(){clearPlay()},playFailed);
}
function playIcon(){return '<svg viewBox="0 0 12 12" fill="currentColor" aria-hidden="true"><path d="M2.5 1.2 10.3 6 2.5 10.8Z"/></svg>'}
function arrow(s){return s.dirs.indexOf('in')>=0?(s.dirs.length>1?'↕':'↓'):(s.dirs[0]==='none'?'·':'↑')}

/* ---------------- coverage stats (needed by several pages) ---------------- */
var COV=(function(){
  var cells=0,imposs=0,speech=0,bbCells={},bbOnly=0;
  D.manners.forEach(function(m){ var row=D.grid[m];
    for(var i=0;i<D.places.length;i++){cells++;
      if(row[i]==='X')imposs++; else if(row[i]==='S')speech++} });
  S.forEach(function(s){var k=s.gmanner+'|'+s.gplace; bbCells[k]=(bbCells[k]||0)+1});
  Object.keys(bbCells).forEach(function(k){ var p=k.split('|');
    if(D.grid[p[0]][D.places.indexOf(p[1])]==='P')bbOnly++ });
  return {cells:cells,imposs:imposs,speech:speech,bbCells:bbCells,
          nCells:Object.keys(bbCells).length,bbOnly:bbOnly,
          noLung:S.filter(function(s){return s.fams.indexOf('pulmonic')<0}).length};
})();
